<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ubicaciones del Almacén</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f5f6f8;
    font-family:Arial,Helvetica,sans-serif;
    color:#222;
}

.contenedor{
    max-width:1100px;
    margin:auto;
}

/* CABECERA */

.cabecera{
    margin-bottom:20px;
}

.cabecera h1{
    margin:0;
    font-size:28px;
    color:#a7a9ad;
    font-weight:900;
}

.cabecera p{
    margin:7px 0 0;
    font-size:17px;
    font-weight:700;
    color:#777b82;
}

/* ESTADISTICAS */

.estadisticas{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:15px;
}

.estadistica{
    background:white;
    border-radius:18px;
    padding:16px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.estadistica .numero{
    display:block;
    font-size:28px;
    font-weight:900;
}

.estadistica .texto{
    display:block;
    margin-top:8px;
    font-size:12px;
    font-weight:900;
}

.total .numero{
    color:#222;
}

.libres .numero{
    color:#53d96d;
}

.ocupadas .numero{
    color:#d43b32;
}

/* BUSCADOR */

.buscador{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.buscador input{
    flex:1;
    border:1px solid #ddd;
    border-radius:15px;
    padding:15px;
    font-size:16px;
    outline:none;
    background:white;
}

.buscador button{
    border:0;
    background:white;
    border-radius:15px;
    padding:0 20px;
    font-weight:900;
    cursor:pointer;
}

/* MODULO */

.modulo{
    background:white;
    border-radius:20px;
    padding:15px;
    margin-bottom:25px;
    box-shadow:0 3px 14px rgba(0,0,0,.07);
}

.modulo-cabecera{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.modulo-nombre{
    font-size:21px;
    font-weight:900;
}

.modulo-rango{
    font-size:13px;
    color:#777;
    font-weight:700;
}

/* TITULOS ALTURAS */

.alturas{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:8px;
}

.altura{
    text-align:center;
    padding:9px 4px;
    background:#f0f1f3;
    border-radius:10px;
    font-size:11px;
    font-weight:900;
}

.altura:first-child{
    color:#555;
}

/* CUATRO ALTURAS */

.ubicaciones{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

/* UBICACION */

.ubicacion{
    min-height:105px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    border-radius:14px;
    border:3px solid #f2c8c5;

    background:#fff5f4;

    cursor:pointer;

    transition:.15s;
}

.ubicacion:active{
    transform:scale(.97);
}

/* OCUPADA */

.ubicacion.ocupada{
    border-color:#f2c8c5;
    background:#fff4f3;
}

.ubicacion.ocupada .codigo{
    color:#d43b32;
}

.ubicacion.ocupada .estado{
    color:#d43b32;
}

/* LIBRE */

.ubicacion.libre{
    border-color:#bceec9;
    background:#eefbf2;
}

.ubicacion.libre .codigo{
    color:#4b83dc;
}

.ubicacion.libre .estado{
    color:#459b52;
}

/* CODIGO */

.codigo{
    font-size:21px;
    font-weight:900;
}

/* ESTADO */

.estado{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    font-size:12px;
    font-weight:900;
}

.punto{
    width:12px;
    height:12px;
    border-radius:50%;
    display:inline-block;
}

.ocupada .punto{
    background:#d43b32;
}

.libre .punto{
    background:#43ad40;
}

/* PIE */

.pie{
    text-align:center;
    color:#888;
    font-size:12px;
    margin:25px 0;
}

/* MOVIL */

@media(max-width:600px){

    body{
        padding:9px;
    }

    .cabecera h1{
        font-size:20px;
    }

    .cabecera p{
        font-size:12px;
    }

    .estadisticas{
        gap:5px;
    }

    .estadistica{
        padding:10px 4px;
        border-radius:12px;
    }

    .estadistica .numero{
        font-size:20px;
    }

    .estadistica .texto{
        font-size:9px;
        margin-top:5px;
    }

    .buscador{
        gap:5px;
    }

    .buscador input{
        padding:11px;
        font-size:13px;
    }

    .buscador button{
        padding:0 11px;
        font-size:11px;
    }

    .modulo{
        padding:8px;
        border-radius:15px;
        margin-bottom:15px;
    }

    .modulo-nombre{
        font-size:15px;
    }

    .modulo-rango{
        font-size:9px;
    }

    .alturas{
        gap:4px;
    }

    .altura{
        font-size:7px;
        padding:5px 1px;
    }

    .ubicaciones{
        gap:4px;
    }

    .ubicacion{
        min-height:78px;
        border-radius:10px;
        border-width:2px;
    }

    .codigo{
        font-size:14px;
    }

    .estado{
        font-size:8px;
        margin-top:5px;
        gap:3px;
    }

    .punto{
        width:8px;
        height:8px;
    }
}

</style>
</head>

<body>

<div class="contenedor">

    <div class="cabecera">

        <h1>📦 UBICACIONES DEL ALMACÉN</h1>

        <p>
            216 ubicaciones · 6 módulos de 36 · 4 alturas por módulo
        </p>

    </div>


    <div class="estadisticas">

        <div class="estadistica total">
            <span class="numero" id="total">216</span>
            <span class="texto">TOTAL</span>
        </div>

        <div class="estadistica libres">
            <span class="numero" id="libres">50</span>
            <span class="texto">LIBRES</span>
        </div>

        <div class="estadistica ocupadas">
            <span class="numero" id="ocupadas">166</span>
            <span class="texto">OCUPADAS</span>
        </div>

    </div>


    <div class="buscador">

        <input
            type="text"
            id="buscar"
            placeholder="Buscar ubicación, por ejemplo A104"
        >

        <button onclick="mostrarTodas()">
            TODAS
        </button>

    </div>


    <div id="contenedorModulos"></div>


    <div class="pie">

        Cada módulo tiene 36 ubicaciones:
        9 filas × 4 alturas.<br>

        ⬅️ Altura 1 = más baja · Altura 4 = más alta ➡️

    </div>

</div>


<script>

/*
====================================================
DATOS DE OCUPACION
true  = LIBRE
false = OCUPADA
====================================================
*/

const libres = new Set([

"A001",
"A019",
"A044",
"A048",
"A051",
"A052",
"A055",
"A056",
"A060",
"A064",
"A067",
"A068",

"A072",
"A075",
"A076",
"A080",
"A084",
"A088",
"A092",
"A096",

"A100",
"A104",
"A105",
"A107",
"A108",
"A111",
"A112",
"A113",
"A115",
"A116",
"A120",
"A122",
"A124",
"A128",
"A132",
"A135",
"A136",
"A140",
"A146",
"A149",
"A152",
"A164",
"A168",
"A172",
"A176",
"A179",
"A180",
"A200",
"A204",
"A214"

]);


/*
====================================================
CREAR LOS 6 MODULOS
====================================================
*/

function crearModulos(){

    const contenedor =
        document.getElementById("contenedorModulos");

    contenedor.innerHTML="";


    for(let modulo=1; modulo<=6; modulo++){

        const inicio =
            ((modulo-1)*36)+1;

        const fin =
            modulo*36;


        const bloque =
            document.createElement("section");

        bloque.className="modulo";


        bloque.innerHTML=`

            <div class="modulo-cabecera">

                <div class="modulo-nombre">
                    MÓDULO ${modulo}
                </div>

                <div class="modulo-rango">
                    A${String(inicio).padStart(3,"0")}
                    –
                    A${String(fin).padStart(3,"0")}
                </div>

            </div>


            <div class="alturas">

                <div class="altura">
                    ALTURA 1<br>
                    MÁS BAJA
                </div>

                <div class="altura">
                    ALTURA 2
                </div>

                <div class="altura">
                    ALTURA 3
                </div>

                <div class="altura">
                    ALTURA 4<br>
                    MÁS ALTA
                </div>

            </div>


            <div
                class="ubicaciones"
                id="modulo-${modulo}">
            </div>

        `;


        contenedor.appendChild(bloque);


        const grid =
            bloque.querySelector(".ubicaciones");


        /*
        36 ubicaciones por módulo

        Cada fila tiene 4 alturas:

        izquierda  = altura 1
                    = altura 2
                     = altura 3
        derecha     = altura 4
        */

        for(let i=inicio; i<=fin; i++){

            const codigo =
                "A"+String(i).padStart(3,"0");

            const estaLibre =
                libres.has(codigo);


            const tarjeta =
                document.createElement("div");


            tarjeta.className =
                "ubicacion " +
                (estaLibre ? "libre" : "ocupada");


            tarjeta.dataset.codigo =
                codigo;


            tarjeta.innerHTML=`

                <div class="codigo">
                    ${codigo}
                </div>

                <div class="estado">

                    <span class="punto"></span>

                    <span>
                        ${estaLibre ? "LIBRE" : "OCUPADA"}
                    </span>

                </div>

            `;


            tarjeta.onclick=function(){

                cambiarEstado(this);

            };


            grid.appendChild(tarjeta);

        }

    }

}


/*
====================================================
CAMBIAR LIBRE / OCUPADA
====================================================
*/

function cambiarEstado(tarjeta){

    const codigo =
        tarjeta.dataset.codigo;


    if(tarjeta.classList.contains("libre")){

        tarjeta.classList.remove("libre");

        tarjeta.classList.add("ocupada");

        tarjeta.querySelector(".estado span:last-child")
            .textContent="OCUPADA";

        libres.delete(codigo);

    }else{

        tarjeta.classList.remove("ocupada");

        tarjeta.classList.add("libre");

        tarjeta.querySelector(".estado span:last-child")
            .textContent="LIBRE";

        libres.add(codigo);

    }


    actualizarContadores();

}


/*
====================================================
CONTADORES
====================================================
*/

function actualizarContadores(){

    const total=216;

    const numeroLibres=
        libres.size;

    const numeroOcupadas=
        total-numeroLibres;


    document.getElementById("total")
        .textContent=total;

    document.getElementById("libres")
        .textContent=numeroLibres;

    document.getElementById("ocupadas")
        .textContent=numeroOcupadas;

}


/*
====================================================
BUSCADOR
====================================================
*/

document
.getElementById("buscar")
.addEventListener("input",function(){

    const texto =
        this.value.toUpperCase().trim();


    document
    .querySelectorAll(".ubicacion")
    .forEach(function(tarjeta){

        const codigo =
            tarjeta.dataset.codigo;


        if(
            texto==="" ||
            codigo.includes(texto)
        ){

            tarjeta.style.display="flex";

        }else{

            tarjeta.style.display="none";

        }

    });

});


/*
====================================================
MOSTRAR TODAS
====================================================
*/

function mostrarTodas(){

    document.getElementById("buscar")
        .value="";


    document
    .querySelectorAll(".ubicacion")
    .forEach(function(tarjeta){

        tarjeta.style.display="flex";

    });

}


/*
====================================================
INICIAR APP
====================================================
*/

crearModulos();

actualizarContadores();

</script>

</body>
</html>
